[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[env]
  PORT = "8080"

[processes]
  api = "./api"
  pusher = "./pusher"
  worker = "./worker"

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["api"]
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
